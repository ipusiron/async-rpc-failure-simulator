name: Test

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observation-policy scenarios
        run: python mcp/scenarios_test.py
      - name: Secure-policy scenarios
        run: python mcp/scenarios_test_secure.py
      - name: Exploit integration (vulnerable success / discard fail)
        run: python challenges/challenge1_orphan_hijack/integration_test.py
