<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async RPC Failure Simulator - Visual Demo</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="skip" href="#main" data-i18n="skip">本文へ移動</a>
    <div class="container">
        <header>
            <button id="language" class="language" type="button" data-i18n="language">English</button>
            <h1>Async RPC Failure Simulator</h1>
            <p class="subtitle" data-i18n="subtitle"></p>
        </header>
        <main id="main">
            <p class="note" data-i18n="modelNote"></p>
            <noscript>JavaScriptを有効にしてください。Enable JavaScript to play the visual demo.</noscript>
            <div class="controls">
                <button class="btn-vulnerable" data-run="vulnerable" type="button" data-i18n="runObserve"></button>
                <button class="btn-secure" data-run="secure" type="button" data-i18n="runDiscard"></button>
                <button id="clear" type="button" data-i18n="clear"></button>
            </div>
            <p id="status" class="status" role="status" aria-live="polite"></p>
            <div class="panels">
            <section class="panel vulnerable" aria-labelledby="vulnerable-heading">
                <h2 id="vulnerable-heading" data-i18n="vulnerable"></h2>
                <div class="actors"><span data-i18n="client"></span><span data-i18n="server"></span></div>
                <ol class="events" id="vulnerable-events"></ol>
                <div class="stats">
                    <h3 data-i18n="statistics"></h3>
                    <div class="stat-row"><span data-i18n="requests"></span><span class="stat-value" id="v-requests">0</span></div>
                    <div class="stat-row"><span data-i18n="responses"></span><span class="stat-value" id="v-responses">0</span></div>
                    <div class="stat-row"><span data-i18n="timeouts"></span><span class="stat-value" id="v-timeouts">0</span></div>
                    <div class="stat-row"><span data-i18n="stored"></span><span class="stat-value" id="v-orphans">0</span></div>
                </div>
            </section>
            <section class="panel secure" aria-labelledby="secure-heading">
                <h2 id="secure-heading" data-i18n="secure"></h2>
                <div class="actors"><span data-i18n="client"></span><span data-i18n="server"></span></div>
                <ol class="events" id="secure-events"></ol>
                <div class="stats">
                    <h3 data-i18n="statistics"></h3>
                    <div class="stat-row"><span data-i18n="requests"></span><span class="stat-value" id="s-requests">0</span></div>
                    <div class="stat-row"><span data-i18n="responses"></span><span class="stat-value" id="s-responses">0</span></div>
                    <div class="stat-row"><span data-i18n="timeouts"></span><span class="stat-value" id="s-timeouts">0</span></div>
                    <div class="stat-row"><span data-i18n="disposed"></span><span class="stat-value" id="s-orphans">0</span></div>
                </div>
            </section>
            </div>
            <p data-i18n="schedule"></p>
            <p data-i18n="countersNote"></p>
            <section class="comparison" aria-labelledby="comparison-heading">
                <h2 id="comparison-heading" data-i18n="comparison"></h2>
                <div class="table-scroll" tabindex="0" role="region" aria-labelledby="comparison-heading">
                    <table>
                        <thead><tr><th scope="col" data-i18n="item"></th><th scope="col" data-i18n="vulnerable"></th><th scope="col" data-i18n="secure"></th></tr></thead>
                        <tbody>
                            <tr><th scope="row" data-i18n="id"></th><td data-i18n="sequential"></td><td data-i18n="random"></td></tr>
                            <tr><th scope="row" data-i18n="orphanPolicy"></th><td data-i18n="retained"></td><td data-i18n="dropped"></td></tr>
                            <tr><th scope="row" data-i18n="timeoutPolicy"></th><td data-i18n="positive"></td><td data-i18n="warned"></td></tr>
                        </tbody>
                    </table>
                </div>
                <p data-i18n="boundaryNote"></p>
                <h3 data-i18n="guarantees"></h3>
                <p data-i18n="limits"></p>
            </section>
        </main>
        <footer>
            <a id="readme" href="https://github.com/ipusiron/async-rpc-failure-simulator/blob/main/README.md" data-i18n="readme"></a>
            <a href="https://github.com/ipusiron/async-rpc-failure-simulator" data-i18n="repository"></a>
        </footer>
    </div>
    <script src="core.js"></script>
    <script src="messages.js"></script>
    <script src="app.js"></script>
</body>
</html>
